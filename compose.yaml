services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-migrations}
    command: ["postgres", "-c", "max_connections=100"]
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./migrations/baseline/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d migrations"]
      interval: 3s
      timeout: 3s
      retries: 20
  app-v1:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-migrations}?sslmode=disable
      APP_VERSION: v1
      INSTANCE_ID: v1-a
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8081:8080"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  app-v1-b:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-migrations}?sslmode=disable
      APP_VERSION: v1
      INSTANCE_ID: v1-b
      HTTP_ADDR: :8080
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8083:8080"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  app-v2:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-migrations}?sslmode=disable
      APP_VERSION: v2
      READ_MODE: ${V2_READ_MODE:-shadow}
      INSTANCE_ID: v2-a
      HTTP_ADDR: :8080
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [v2]
    ports: ["8082:8080"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  app-v2-b:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-migrations}?sslmode=disable
      APP_VERSION: v2
      READ_MODE: ${V2_READ_MODE:-shadow}
      INSTANCE_ID: v2-b
      HTTP_ADDR: :8080
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [v2]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
    ports: ["8084:8080"]
  dashboard:
    build: .
    entrypoint: ["/usr/local/bin/dashboard"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-migrations}?sslmode=disable
      HTTP_ADDR: :8090
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8090:8090"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8090/api/status >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 2s
      retries: 20
volumes:
  pgdata:
